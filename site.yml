---

- hosts: all
  become: true
  tasks:
  - name: install update
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

- hosts: SRV1
  become: true
  tasks:
    - name: install apache
      package:
         name:
          - apache2
         state: latest
    - name: copy default apache config
      copy:
        src: files/default_site.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'
