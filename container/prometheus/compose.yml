# named volume 'prometheus-data' is marked as "external" (used by service 'prometheus'), so either remove "external" from volume definition or it needs to be created using: docker volume create prometheus-data
# named volume 'prometheus-conf' is marked as "external" (used by service 'prometheus'), so either remove "external" from volume definition or it needs to be created using: docker volume create prometheus-conf
name: <your project name>
services:
    prometheus:
        ports:
            - 9090:9090
        volumes:
            - /var/lib/docker/volumes/prometheus-data:/prometheus
            - /var/lib/docker/volumes/prometheus-conf:/etc/prometheus
        container_name: prometheus
        image: prom/prometheus
volumes:
    prometheus-data:
        external: true
        name: prometheus-data
    prometheus-conf:
        #external: true
        name: prometheus-conf